[workspace]
members = ["crates/meld-core", "crates/meld-cli"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["YeraldoSmith"]
license = "AGPL-3.0-only"
repository = "https://github.com/YeraldoSmith/ShardMeld"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
tempfile = "3.23"
ureq = "3.4"
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
